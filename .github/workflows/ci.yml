name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts：esbuild 的 postinstall 会 spawn 子进程，
      # 在 Actions 上会触发 npm 的 "Exit handler never called" 崩溃。
      # 项目不依赖任何 postinstall 产物（esbuild 平台二进制走 optionalDependencies），
      # 顺带也避免执行依赖里的任意安装脚本。
      - run: npm ci --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建前端
        run: npm run build

      - name: 检查构建产物
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          echo "构建产物 OK"
