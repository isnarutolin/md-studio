name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # runner 自带的 npm 10.9.9 在这里会直接以 "Exit handler never called" 崩掉
      # （零输出、启动阶段即退出），先升级到最新 npm。
      - name: 升级 npm
        run: npm install -g npm@latest

      # --ignore-scripts：项目不依赖任何 postinstall 产物
      # （esbuild 平台二进制走 optionalDependencies，electron 二进制由 electron-builder 自己下载），
      # 同时避免执行第三方依赖的任意安装脚本。
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建前端
        run: npm run build

      - name: 检查构建产物
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          echo "构建产物 OK"
