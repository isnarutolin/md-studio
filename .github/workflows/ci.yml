name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建前端
        run: npm run build

      - name: 检查构建产物
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          echo "构建产物 OK"
