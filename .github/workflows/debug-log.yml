name: DebugLog
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 收集诊断
        run: |
          {
            echo "=== node/npm ==="
            node -v; npm -v; npx tsc -v
            echo
            echo "=== npm ci ==="
            npm ci 2>&1 | tail -20
            echo
            echo "=== typecheck ==="
            npm run typecheck 2>&1
            echo "typecheck exit=$?"
            echo
            echo "=== test ==="
            npm test 2>&1 | tail -40
            echo
            echo "=== build ==="
            npm run build 2>&1 | tail -20
          } > /tmp/diag.txt 2>&1 || true
          cat /tmp/diag.txt
      - name: 推回日志
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          git checkout --orphan debug/ci-output 2>/dev/null || git checkout debug/ci-output
          cp /tmp/diag.txt diag.txt
          git add -A
          git commit -m "ci diagnostics" || true
          git push -f origin debug/ci-output
